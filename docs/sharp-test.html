<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>怎樣處理已知高寬時，最終要呈現 contain 的圖片的骨架</title>
    <style>
      .container {
        display: flex;
        gap: 20px;
        padding: 20px;
        align-items: flex-start;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 200px;
      }
      .a-random-parent-container {
        width: 50vw;
        height: 50vh;
        border: 1px solid #ccc;
      }
      .the-original-fake-image-container {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="controls">
        <label>要模擬的寬度: <input type="number" id="width" value="200" /></label>
        <label>要模擬的高度: <input type="number" id="height" value="100" /></label>
        <button onclick="updateImage()">生成圖片</button>
      </div>
      <div class="a-random-parent-container">
        <img class="the-original-fake-image-container" id="resultImg" src="" alt="請點擊生成" />
      </div>
    </div>

    <script>
      function generateShimmerSvg(width, height) {
        // Shimmer 動畫的 CSS
        const shimmerStyle = `
          .shimmer-bg {
            fill: #e0e0e0; /* 骨架基礎色 */
          }
          .shimmer-gradient {
            animation: shimmer 1.5s ease-in infinite forwards;
          }
          @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
        `;

        // SVG 定義
        const svgContent = `
          <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
            <style>${shimmerStyle}</style>
            <defs>
              <linearGradient id="shimmerGradient">
                <stop offset="0%" stop-color="#e0e0e0" stop-opacity="1"/>
                <stop offset="30%" stop-color="#f5f5f5" stop-opacity="1"/>
                <stop offset="60%" stop-color="#e0e0e0" stop-opacity="1"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="${width}" height="${height}" fill="#e0e0e0" class="shimmer-bg"/>
            <rect x="0" y="0" width="${width}" height="${height}" fill="url(#shimmerGradient)" class="shimmer-gradient"/>
          </svg>
        `;
        return `data:image/svg+xml;utf8,${encodeURIComponent(svgContent)}`;
      }

      function generateShimmerSvg2(width, height) {
        const shimmerStyle = `
    .base {
      fill: #e6e6e6;
    }

    .wave {
      animation: shimmerMove 2.2s cubic-bezier(0.4,0,0.2,1) infinite;
    }

    .wave2 {
      animation: shimmerMove2 2.8s cubic-bezier(0.4,0,0.2,1) infinite;
    }

    @keyframes shimmerMove {
      0% {
        transform: translateX(-120%);
      }
      50% {
        transform: translateX(20%);
      }
      100% {
        transform: translateX(120%);
      }
    }

    @keyframes shimmerMove2 {
      0% {
        transform: translateX(-150%);
      }
      50% {
        transform: translateX(-10%);
      }
      100% {
        transform: translateX(130%);
      }
    }
  `;

        const svgContent = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="${width}"
       height="${height}"
       viewBox="0 0 ${width} ${height}">

    <style>${shimmerStyle}</style>

    <defs>
      <!-- 主掃光 -->
      <linearGradient id="mainGradient" gradientUnits="userSpaceOnUse"
        x1="0" y1="0" x2="${width}" y2="0">
        <stop offset="0%" stop-color="#e6e6e6"/>
        <stop offset="35%" stop-color="#f3f3f3"/>
        <stop offset="50%" stop-color="#ffffff"/>
        <stop offset="65%" stop-color="#f3f3f3"/>
        <stop offset="100%" stop-color="#e6e6e6"/>
      </linearGradient>

      <!-- 柔和第二層光 -->
      <linearGradient id="softGradient" gradientUnits="userSpaceOnUse"
        x1="0" y1="0" x2="${width}" y2="0">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- 底色 -->
    <rect width="${width}" height="${height}" class="base"/>

    <!-- 主掃光 -->
    <rect
      class="wave"
      x="${-width}"
      y="0"
      width="${width * 2}"
      height="${height}"
      fill="url(#mainGradient)"
    />

    <!-- 柔光層 -->
    <rect
      class="wave2"
      x="${-width * 1.5}"
      y="0"
      width="${width * 2.5}"
      height="${height}"
      fill="url(#softGradient)"
    />

  </svg>
  `;

        return `data:image/svg+xml;utf8,${encodeURIComponent(svgContent)}`;
      }

      function updateImage() {
        const w = document.getElementById("width").value;
        const h = document.getElementById("height").value;
        const imgElement = document.getElementById("resultImg");

        // 生成 SVG 字串並設定給 img 標籤
        imgElement.src = generateShimmerSvg2(w, h);
      }
    </script>
  </body>
</html>
